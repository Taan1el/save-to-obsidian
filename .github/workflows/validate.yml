name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install helper dependencies
        run: python -m pip install -r helper\requirements.txt

      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress

      - name: Validate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate.ps1

      - name: Package extension
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-extension.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: save-to-obsidian-extension
          path: dist/save-to-obsidian-extension.zip
